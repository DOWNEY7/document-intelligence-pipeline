version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc-intelligence-api
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - PORT=8000
      - USE_MOCK_AZURE=true
      - USE_MOCK_COSMOS=true
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/store:/app/data/store
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc-intelligence-dashboard
    command: ["streamlit", "run", "src/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
